<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra | BRAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-page { display: grid; grid-template-columns: 1fr 450px; gap: 4rem; max-width: 1200px; margin: 0 auto; padding: 8rem 5% 4rem; }
        
        .checkout-section h2 { font-family: var(--font-luxury); font-size: 1.5rem; text-transform: uppercase; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #000; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* Columna Derecha: Resumen */
        .order-summary { background: #fdfdfd; padding: 2rem; border: 1px solid #eee; height: fit-content; position: sticky; top: 100px; }
        .summary-item { display: flex; gap: 15px; margin-bottom: 1.5rem; align-items: center; }
        .summary-img { width: 70px; height: 90px; object-fit: cover; }
        .summary-info { flex: 1; }
        .summary-info strong { display: block; font-size: 0.9rem; }
        .summary-info span { font-size: 0.7rem; color: #888; }

        .total-box { margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid #000; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-family: var(--font-luxury); }

        /* Contenedor Botón PayPal */
        #paypal-button-container { margin-top: 2.5rem; min-height: 150px; }

        @media (max-width: 900px) {
            .checkout-page { grid-template-columns: 1fr; padding-top: 6rem; }
            .order-summary { order: -1; position: static; }
        }
        .discount-row {
        margin-top: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 0.8rem;
}
    </style>
</head>
<body>

    <header class="main-header">
        <nav class="nav-container">
            <a href="index.html" class="logo">ANVI</a>
            <a href="cart.html" style="text-decoration:none; font-size:0.7rem; letter-spacing:1px; color:#888;">← VOLVER AL CARRITO</a>
        </nav>
    </header>

    <main class="checkout-page">
        <section class="checkout-section">
            <form id="checkout-form">
                <h2>1. Información de Envío</h2>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Dirección de entrega</label>
                    <input type="text" id="direccion" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="ciudad" required>
                    </div>
                    <div class="form-group">
                        <label>Código Postal</label>
                        <input type="text" id="cp" required>
                    </div>
                </div>

                <h2 style="margin-top: 3rem;">2. Pago Seguro</h2>
                <p style="font-size: 0.75rem; color: #666; margin-bottom: 1rem;">Haz clic en el botón de abajo para completar tu pedido con PayPal.</p>
                
                <div id="paypal-button-container"></div>
            </form>
        </section>

        <aside class="order-summary">
            <h3 style="font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1.5rem;">Resumen del pedido</h3>
            <div id="checkout-items-list">
                </div>
            <div class="total-box">
                <div class="total-row">
                    <span>TOTAL</span>
                    <span id="final-total">0.00€</span>
                </div>
            </div>
        </aside>
    </main>

    <script src="products.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AUJ5d7tO2A1zb7S1_QtXETLkueizJsOJHgggJMnvetZ-FnjYYsjtWRsTJDb3TmPl07Sc2lO6JGNWM-Ke&currency=EUR"></script>
    <script src="checkout.js"></script>
    <script src="main.js"></script>
</body>
</html>
