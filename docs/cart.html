<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cesta | BRAND</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
    
    <style>
/* --- ESTILOS EXISTENTES (MANTENIDOS) --- */
.cart-page { padding: 8rem 5% 4rem; max-width: 1100px; margin: 0 auto; min-height: 80vh; }

.cart-header { 
    border-bottom: 1px solid #000; 
    padding-bottom: 1.5rem; 
    margin-bottom: 3rem; 
    display: flex; 
    justify-content: space-between; 
    align-items: baseline; 
}

.cart-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
.cart-table th { 
    text-align: left; padding: 1rem; border-bottom: 1px solid #eee; 
    text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; color: #888; 
}

.cart-item td { padding: 2rem 1rem; border-bottom: 1px solid #eee; vertical-align: middle; }
.cart-product-info { display: flex; align-items: center; gap: 25px; }
.cart-img { width: 110px; height: 145px; object-fit: cover; background: #f9f9f9; }

/* --- BOTÓN ELIMINAR (RECUPERADO) --- */
.remove-btn { 
    background: transparent; 
    border: 1px solid #000; 
    color: #000; 
    cursor: pointer; 
    font-size: 0.65rem; 
    text-transform: uppercase; 
    letter-spacing: 2px; 
    padding: 10px 20px; 
    transition: all 0.3s ease;
    font-weight: 600;
}
.remove-btn:hover { background: #000; color: #fff; }

/* --- SECCIÓN SUMMARY (ANCHO MÁXIMO) --- */
.cart-summary { 
    margin-top: 4rem; 
    width: 100%; /* Ocupa el 100% de los 1100px del contenedor padre */
    display: flex; 
    flex-direction: column; 
    gap: 2rem; 
}

.summary-content-wrapper {
    width: 100%; /* Estirado al máximo */
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.discount-container { 
    display: flex; 
    gap: 10px; 
    width: 100%; 
}

#discount-input { 
    flex: 1; 
    padding: 15px; 
    border: 1px solid #eee; 
    text-transform: uppercase; 
    font-size: 0.8rem; 
    letter-spacing: 1px;
}

#apply-discount { 
    background: #000; 
    color: #fff; 
    border: none; 
    padding: 0 40px; 
    cursor: pointer; 
    font-size: 0.7rem; 
    text-transform: uppercase; 
    font-weight: 600;
}

.breakdown { 
    border-top: 1px solid #eee; 
    padding-top: 2rem; 
    width: 100%; 
}

.breakdown-row { 
    display: flex; 
    justify-content: space-between; 
    margin-bottom: 1.2rem; 
    font-size: 0.9rem; 
    letter-spacing: 1px; 
    text-transform: uppercase; 
    color: #666; 
}

.total-row { 
    display: flex; 
    justify-content: space-between; 
    align-items: baseline; 
    border-top: 1px solid #000; 
    padding-top: 2rem; 
    width: 100%;
}

.total-amount { 
    font-family: var(--font-luxury); 
    font-size: 3.5rem; /* Un poco más grande para llenar el ancho */
    font-weight: 500; 
}

.checkout-btn { 
    background: #000; 
    color: #fff; 
    border: none; 
    padding: 2rem; 
    font-size: 1rem; 
    text-transform: uppercase; 
    letter-spacing: 4px; 
    cursor: pointer; 
    width: 100%; 
    font-weight: 600;
    transition: background 0.3s;
}

.checkout-btn:hover { background: #333; }

/* --- RESPONSIVE MÓVIL --- */
@media (max-width: 768px) {
    .cart-table thead { display: none; }
    .cart-item td { display: block; padding: 0.5rem 0; border: none; text-align: left; }
    .cart-img { width: 90px; height: 120px; }
    .total-amount { font-size: 2.5rem; }
    .remove-btn { width: 100%; text-align: center; }
    .checkout-btn { padding: 1.5rem; font-size: 0.85rem; }
}
    </style>
</head>
<body>

    <header class="main-header">
        <nav class="nav-container">
            <a href="index.html" class="logo">ANVI</a>
            <div class="cart-trigger">
                <a href="index.html" style="text-decoration: none; color: #888; font-size: 0.75rem; letter-spacing: 2px;">← VOLVER</a>
            </div>
        </nav>
    </header>

    <main class="cart-page">
        <div id="cart-content">
            <div class="cart-header">
                <h1>Tu Cesta</h1>
                <span id="items-count">0 ARTÍCULOS</span>
            </div>
            
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Talla</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cart-items-body">
                    </tbody>
            </table>

            <br>
            <br>

            <div class="cart-summary">
                <div class="summary-content-wrapper">
                    
                    <div class="discount-container">
                        <input type="text" id="discount-input" placeholder="INTRODUCE TU CÓDIGO DE DESCUENTO">
                        <button type="button" id="apply-discount" onclick="applyDiscount()">APLICAR</button> 
                    </div>
                    <div id="discount-message" style="font-size: 0.7rem; letter-spacing: 1px; margin-top: 5px; height: 20px;"></div>
                    
                    <div class="breakdown">
                        <div class="breakdown-row">
                            <span>Subtotal de productos</span>
                            <span id="cart-subtotal">0.00 €</span>
                        </div>
                        <div class="breakdown-row">
                            <span>Gastos de envío estimados</span>
                            <span id="cart-shipping">0.00 €</span>
                        </div>
                        <div id="descuento-fila" class="breakdown-row" style="display: none; color: #27ae60; font-weight: 600;">
                            <span>Descuento aplicado</span>
                            <span id="cart-discount">0.00 €</span>
                        </div>
                    </div>
            
                    <div class="total-row">
                        <span style="text-transform: uppercase; letter-spacing: 3px; font-weight: 600; font-size: 1.2rem;">Total</span>
                        <span class="total-amount" id="total-price">0.00 €</span>
                    </div>
                    
                    <button onclick="window.location.href='checkout.html'" class="checkout-btn">
                        Finalizar Pedido
                    </button>
                </div>
            </div>

        </div>

        <div id="empty-cart-msg" class="empty-cart" style="display: none;">
            <p style="font-family: var(--font-luxury); font-size: 1.5rem; margin-bottom: 2rem;">Tu cesta está vacía</p>
            <a href="index.html" class="checkout-btn" style="text-decoration: none;">Explorar Colección</a>
        </div>
    </main>

    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="main.js"></script>
</body>
</html>
